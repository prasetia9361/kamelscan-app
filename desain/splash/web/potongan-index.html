<!--
  ====================================================================
  POTONGAN UNTUK web/index.html  —  layar peluncur Flutter Web
  ====================================================================

  Masalahnya: <body> pada web/index.html benar-benar kosong kecuali satu baris
  pemuat Flutter. Bundelnya 4,3 MB, jadi di sinyal gudang yang jelek pengunjung
  menatap layar putih belasan detik tanpa tanda apa pun bahwa sesuatu sedang
  terjadi. Sebagian akan menutup tabnya sebelum aplikasinya sempat muncul.

  Cara pasang: SISIPKAN blok <style> di bawah ke dalam <head>, lalu GANTI isi
  <body> dengan blok kedua. Jangan sentuh baris <base href="$FLUTTER_BASE_HREF">.

  🔴 Logonya ditanam sebagai data-URI, bukan berkas terpisah. Itu disengaja:
  berkas terpisah berarti satu permintaan jaringan lagi, dan di sinyal buruk
  permintaan itu sendiri bisa gagal — sehingga layar peluncurnya ikut kosong,
  persis masalah yang sedang diperbaiki.

  🔴 TIDAK memerlukan perubahan apa pun di lib/. Penghilangan layar peluncur
  memakai MutationObserver yang menunggu Flutter menggambar bingkai
  pertamanya, bukan panggilan dari sisi Dart.
-->

<!-- ============ 1. SISIPKAN INI DI DALAM <head> ============ -->
<style>
  :root { --splash-bg: #F2F5F9; --splash-fg: #4A5567; --splash-bar: #0D5EA6; }
  @media (prefers-color-scheme: dark) {
    :root { --splash-bg: #0F141A; --splash-fg: #A5B3C4; --splash-bar: #8FC3F0; }
  }
  html, body { margin: 0; height: 100%; background: var(--splash-bg); }
  #splash {
    position: fixed; inset: 0; z-index: 9999;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 28px; background: var(--splash-bg);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    transition: opacity .35s ease;
  }
  #splash.pergi { opacity: 0; pointer-events: none; }
  #splash img { width: 168px; height: auto; }
  #splash .bar {
    width: 168px; height: 4px; border-radius: 2px;
    background: color-mix(in srgb, var(--splash-bar) 22%, transparent);
    overflow: hidden;
  }
  #splash .bar i {
    display: block; width: 40%; height: 100%; border-radius: 2px;
    background: var(--splash-bar);
    animation: geser 1.4s ease-in-out infinite;
  }
  @keyframes geser { 0% { transform: translateX(-105%);} 100% { transform: translateX(255%);} }
  #splash p { margin: 0; font-size: 14px; color: var(--splash-fg); }
  @media (prefers-reduced-motion: reduce) {
    #splash .bar i { animation: none; width: 100%; opacity: .5; }
    #splash { transition: none; }
  }
</style>

<script>
(function () {
  var s = document.getElementById('splash');
  if (!s) return;
  var selesai = false;

  function pergi() {
    if (selesai) return;
    selesai = true;
    s.classList.add('pergi');
    setTimeout(function () { if (s.parentNode) s.parentNode.removeChild(s); }, 400);
  }

  // Menunggu Flutter menggambar bingkai pertamanya. Nama elemennya berubah
  // antar versi Flutter, jadi keduanya diperiksa.
  var pengamat = new MutationObserver(function () {
    if (document.querySelector('flutter-view, flt-glass-pane')) {
      pengamat.disconnect();
      pergi();
    }
  });
  pengamat.observe(document.body, { childList: true, subtree: true });

  // Di sinyal buruk, diam belasan detik membuat orang mengira halamannya
  // rusak. Setelah 8 detik kalimatnya diganti supaya jelas ini soal koneksi.
  setTimeout(function () {
    var t = document.getElementById('splash-teks');
    if (t && !selesai) t.textContent = 'Koneksi sedang lambat, mohon tunggu\u2026';
  }, 8000);

  // 🔴 Jaring pengaman. Bila penanda elemen Flutter berubah di versi
  // berikutnya, tanpa baris ini layar peluncur akan menutupi aplikasi
  // selamanya — cacat yang jauh lebih parah daripada layar putih.
  setTimeout(pergi, 20000);
})();
</script>
