include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - "**/*.freezed.dart"
    - "**/*.g.dart"
    - "lib/l10n/generated/**"
  errors:
    # Bab 9.11 poin 1 — string yang dilihat pengguna wajib lewat ARB.
    # Dijadikan warning agar terlihat di CI tanpa memblokir build lokal.
    invalid_annotation_target: ignore
  language:
    strict-casts: true
    strict-raw-types: true

linter:
  rules:
    # ---------- Aturan Bab 3.1 ----------
    # Impor lib/ memakai path relatif; `package:` hanya untuk paket luar.
    - avoid_relative_lib_imports
    - prefer_const_constructors
    - prefer_const_constructors_in_immutables
    - prefer_const_declarations
    - prefer_final_locals
    - prefer_final_in_for_each
    - unnecessary_late

    # ---------- Kualitas & keamanan ----------
    - avoid_print                 # pakai AppLogger, bukan print
    - avoid_slow_async_io
    - cancel_subscriptions
    - close_sinks
    - only_throw_errors
    - throw_in_finally
    - unawaited_futures
    - use_build_context_synchronously

    # ---------- Keterbacaan ----------
    - always_declare_return_types
    - directives_ordering
    - prefer_single_quotes
    - unnecessary_parenthesis
