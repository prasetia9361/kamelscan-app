name: kamelscan
description: "KamelScan (ScanProof) — Barcode-Triggered Video Packing System (SaaS)"
publish_to: 'none'

# versionName / versionCode. Naikkan lewat --build-name / --build-number di CI.
version: 1.0.0+1

# Toolchain yang dipakai proyek ini: Flutter 3.44.8 / Dart 3.12.2.
# Bab 4.2 menulis batas minimum berdasarkan toolchain Agustus 2026; sebagian
# versi di sana sudah tidak dapat di-resolve pada Dart 3.12. Seluruh deviasi
# dicatat di DEVIASI_LIBRARY.md — baca sebelum menaikkan/menurunkan versi.
environment:
  # DEVIASI: Bab 4.1 menulis "Dart 3.5+". json_serializable 6.14 menolak
  # bahasa di bawah 3.8, jadi batas bawah dinaikkan.
  sdk: ^3.8.0
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.9

  # ---------- State management & DI ----------
  flutter_riverpod: ^3.3.2          # DEVIASI: doc ^2.5.1 (lihat DEVIASI_LIBRARY.md)
  riverpod_annotation: ^4.0.3       # DEVIASI: doc ^2.3.5

  # ---------- Model & serialisasi ----------
  freezed_annotation: ^3.1.0        # DEVIASI: doc ^2.4.4
  json_annotation: ^4.12.0
  equatable: ^2.1.0

  # ---------- Navigasi ----------
  go_router: ^17.5.0                # DEVIASI: doc ^14.2.0

  # ---------- Backend ----------
  supabase_flutter: ^2.17.1
  google_sign_in: ^7.2.0            # DEVIASI: doc ^6.2.1, API v7 berbeda total

  # ---------- Kamera & scanner ----------
  camera: ^0.12.0
  mobile_scanner: ^7.4.0            # DEVIASI: doc ^5.1.1
  permission_handler: ^13.0.1       # DEVIASI: doc ^11.3.1

  # ---------- Video ----------
  # DEVIASI: ffmpeg_kit_flutter_min_gpl sudah ditarik dari pub.dev.
  # ffmpeg_kit_flutter_new adalah fork aktif yang menyertakan drawtext & libx264.
  ffmpeg_kit_flutter_new: ^4.6.2
  video_player: ^2.13.0
  chewie: ^1.14.1
  # DEVIASI: video_thumbnail (doc ^0.5.3) DIHAPUS — build Android gagal karena
  # paketnya menerapkan 'kotlin-android' tanpa Android Gradle plugin. Thumbnail
  # dibuat FFmpeg lewat MobileVideoProcessor.generateThumbnail().

  # ---------- Lokasi ----------
  geolocator: ^14.0.3               # DEVIASI: doc ^12.0.0
  geocoding: ^5.0.0                 # DEVIASI: doc ^3.0.0

  # ---------- Penyimpanan lokal & antrian ----------
  drift: ^2.34.3                    # SQLite untuk upload_queue
  drift_flutter: ^0.3.1             # DEVIASI: pengganti sqlite3_flutter_libs (EOL)
  path_provider: ^2.1.6
  path: ^1.9.1
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^11.0.0   # DEVIASI: doc ^9.2.2

  # ---------- Background worker ----------
  workmanager: ^0.10.7              # DEVIASI: doc ^0.5.2
  connectivity_plus: ^7.3.1         # DEVIASI: doc ^6.0.3
  flutter_local_notifications: ^22.3.0  # DEVIASI: doc ^17.2.1

  # ---------- Jaringan & upload ----------
  dio: ^5.11.0
  http: ^1.6.0

  # ---------- Audio ----------
  flutter_tts: ^4.2.5

  # ---------- UI ----------
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  fl_chart: ^1.2.0                  # DEVIASI: doc ^0.68.0
  image_picker: ^1.2.3
  image_cropper: ^12.2.1            # DEVIASI: doc ^8.0.2
  flutter_svg: ^2.3.0
  intl: ^0.20.2                     # DEVIASI: doc ^0.19.0 (dipaksa flutter_localizations)

  # ---------- Pembayaran ----------
  url_launcher: ^6.3.2
  webview_flutter: ^4.14.1

  # ---------- Utilitas ----------
  uuid: ^4.6.0
  share_plus: ^13.3.0               # DEVIASI: doc ^9.0.0
  package_info_plus: ^10.2.1        # DEVIASI: doc ^8.0.0
  device_info_plus: ^13.2.0         # DEVIASI: doc ^10.1.0
  sentry_flutter: ^8.14.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.15.1
  # DEVIASI: doc ^2.5.7. Stabil terakhir (3.2.5) belum mendukung analyzer 12
  # yang diwajibkan build_runner 2.15 pada Dart 3.12, sehingga pra-rilis dipakai.
  freezed: ^3.2.6-dev.1
  json_serializable: ^6.14.1
  riverpod_generator: ^4.0.4        # DEVIASI: doc ^2.4.3
  drift_dev: ^2.34.0
  flutter_lints: ^6.0.0             # DEVIASI: doc ^4.0.0
  mocktail: ^1.0.5
  # DEVIASI: golden_toolkit dihentikan pengembangannya (discontinued) dan tidak
  # kompatibel dengan Flutter 3.44. Golden test memakai matchesGoldenFile bawaan.

flutter:
  uses-material-design: true
  generate: true                    # gen_l10n, konfigurasi di l10n.yaml

  assets:
    - assets/images/
    - assets/icons/

  # Dibundel sebagai aset, BUKAN google_fonts runtime.
  # palet_warna_dan_tipografi.md §3.1: di gudang bersinyal buruk, huruf yang
  # diunduh saat aplikasi dibuka akan gagal muat dan teks tampil dengan huruf
  # cadangan atau kosong. Hanya 4 berat Inter + 1 mono — tiap berat tambahan
  # menambah ± 300 KB tanpa manfaat nyata (§3.1).
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700
