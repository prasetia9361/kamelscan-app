org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# ---------------------------------------------------------------------------
# Kompilasi inkremental Kotlin DIMATIKAN — bukan pilihan gaya, tapi keharusan.
#
# Cache paket Dart berada di C:\Users\ACER\AppData\Local\Pub\Cache sedangkan
# proyek ada di drive E:. `RelocatableFileToPathConverter` milik Kotlin
# menghitung path RELATIF dari berkas sumber plugin ke folder proyek untuk
# menyimpan cache inkremental. Di Windows, path relatif antar drive tidak ada,
# sehingga muncul:
#
#   java.lang.IllegalArgumentException: this and base files have different roots
#   ... Could not close incremental caches in ...\build\<plugin>\kotlin\...
#
# dan seluruh build gagal (mis. :device_info_plus, :camera_android_camerax).
#
# Konsekuensi: build ulang jadi lebih lambat karena modul Kotlin selalu
# dikompilasi penuh. Dapat dicabut bila suatu saat PUB_CACHE dipindahkan ke
# drive yang sama dengan proyek (mis. `setx PUB_CACHE E:\pub-cache`).
# ---------------------------------------------------------------------------
kotlin.incremental=false
kotlin.incremental.android=false
kotlin.incremental.useClasspathSnapshot=false
