<!DOCTYPE html>
<html lang="id">
<head>
  <!--
    Diganti oleh nilai `--base-href` saat `flutter build`. Untuk produksi
    aplikasi ini dibangun dengan `--base-href /app/` (Bab 10.2): akar `/`
    ditempati landing page statis, Flutter Web menempati `/app/`.

    🔴 Jangan menuliskannya sebagai `/app/` di sini. Nilainya harus tetap
    `$FLUTTER_BASE_HREF` agar build lokal (`flutter run -d chrome`) yang
    melayani dari `/` tidak ikut tergeser dan berakhir layar putih.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="KamelScan — bukti video setiap paket, otomatis. Rekaman packing terpicu barcode/QR untuk melindungi toko online dari sengketa marketplace.">
  <meta name="theme-color" content="#0D5EA6">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="KamelScan">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>KamelScan</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
